name: Threat Data Pipeline

on:
  schedule:
    - cron: '15 4 14 1,4,7,10 *'   # Cadence: quarterly snapshot. Keyed feeds (AbuseIPDB/OTX/GreyNoise) are DISABLED in collect.mjs — secrets can't ship client-side; snapshot runs on keyless feeds only. The globe shows the last snapshot, not live data.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/data-pipeline.yml'

# Allow only one concurrent run; cancel any in-flight to use latest secrets/code
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline deps
        working-directory: pipeline
        run: npm install --no-audit --no-fund

      - name: Collect raw threat data
        working-directory: pipeline
        env:
          # AbuseIPDB/OTX/GreyNoise keys intentionally not passed — those sources
          # are disabled in collect.mjs (KEYED_SOURCES_DISABLED). MaxMind stays:
          # it geolocates the keyless feeds and never leaves the pipeline.
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: node collect.mjs

      - name: Aggregate
        working-directory: pipeline
        run: node aggregate.mjs

      - name: Commit data updates
        run: |
          git config user.name  "threatglobe-bot"
          git config user.email "threatglobe-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh threat data $(date -u +%Y-%m-%dT%H:%MZ)"
            # Retry-on-conflict push (someone else may have committed)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
