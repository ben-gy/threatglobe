<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ThreatGlobe — real-time global cyber threat observatory visualising attacks aggregated from public threat intelligence feeds." />
    <meta property="og:title" content="ThreatGlobe — Global Cyber Threat Observatory" />
    <meta property="og:description" content="Interactive 3D globe of global cyber attack activity." />
    <meta property="og:type" content="website" />
    <title>ThreatGlobe — Global Cyber Threat Observatory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-primary">
    <div id="root"></div>
    <script>
      // SPA redirect decoder — pairs with public/404.html for GitHub Pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
